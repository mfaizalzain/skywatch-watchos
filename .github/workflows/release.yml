name: "SkyWatch Release (TestFlight)"

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (must exist in ASC), e.g. 1.0"
        required: true
        default: "1.0"
      build_number:
        description: "Build number (auto = timestamp if empty)"
        required: false
        default: ""

concurrency:
  group: skywatch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (required for App Store uploads)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Regenerate project (drift guard)
        run: |
          python3 tools_genproj.py
          git diff --exit-code -- SkyWatch.xcodeproj/project.pbxproj || {
            echo "::error::project.pbxproj drifted from tools_genproj.py — regenerate and commit"
            exit 1
          }

      - name: Import signing certificate
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          CERT_DIR="$RUNNER_TEMP/certs"
          mkdir -p "$CERT_DIR"
          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_DIR/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_DIR/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" || { echo "::error::p12 import failed"; exit 1; }
          security list-keychains -d user -s "$KEYCHAIN" "$(security list-keychains -d user | head -1 | tr -d '\"')"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null 2>&1 || true
          echo "Certificates in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profiles
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_WATCHAPP_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_WATCHAPP_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHAREEXT_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHAREEXT_BASE64 }}
        run: |
          PROFILE_DIR="$RUNNER_TEMP/profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/main.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_WATCHAPP_BASE64" | base64 --decode > "$PROFILE_DIR/watchapp.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_SHAREEXT_BASE64" | base64 --decode > "$PROFILE_DIR/widget.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_DIR/main.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp "$PROFILE_DIR/watchapp.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp "$PROFILE_DIR/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          PROFILE_NAME="$(security cms -D -i "$PROFILE_DIR/main.mobileprovision" | plutil -extract Name raw -)"
          PROFILE_NAME_WATCHAPP="$(security cms -D -i "$PROFILE_DIR/watchapp.mobileprovision" | plutil -extract Name raw -)"
          PROFILE_NAME_SHAREEXT="$(security cms -D -i "$PROFILE_DIR/widget.mobileprovision" | plutil -extract Name raw -)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_NAME_WATCHAPP=$PROFILE_NAME_WATCHAPP" >> "$GITHUB_ENV"
          echo "PROFILE_NAME_SHAREEXT=$PROFILE_NAME_SHAREEXT" >> "$GITHUB_ENV"
          echo "Installed: $PROFILE_NAME / $PROFILE_NAME_WATCHAPP / $PROFILE_NAME_SHAREEXT"

      - name: Configure App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "API key installed for id $ASC_API_KEY_ID"

      - name: Archive (iOS container, watch app embedded)
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$(date +%Y%m%d%H%M%S)}"
          echo "Building SkyWatch $MARKETING_VERSION ($BUILD_NUMBER)"
          # The scheme's primary buildable is the iOS watchapp2-container; the
          # watch app + widget are embedded into it (Watch/ dir). Archiving the
          # container is what makes the archive App-Store-distributable.
          xcodebuild archive \
            -project SkyWatch.xcodeproj \
            -scheme SkyWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SkyWatch.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>S232V5F699</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fmz.skywatch</key>
              <string>${PROFILE_NAME}</string>
              <key>com.fmz.skywatch.watchkitapp</key>
              <string>${PROFILE_NAME_WATCHAPP}</string>
              <key>com.fmz.skywatch.watchkitapp.widget</key>
              <string>${PROFILE_NAME_SHAREEXT}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SkyWatch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -quiet
          echo "=== exported files ==="
          ls -laR "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 2 -name '*.ipa' | head -1)"
          echo "Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose
