name: CI

on:
  push:
    branches: [main]
  pull_request:

# A public repo, so these minutes are free; keep it tight anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The project file is generated, so drift is a real failure mode: someone adds a file in
      # Xcode, forgets it in git, and the regenerated project silently drops it.
      - name: Verify project file is in sync with tools_genproj.py
        run: |
          python3 tools_genproj.py
          git diff --exit-code -- SkyWatch.xcodeproj/project.pbxproj

      # The project targets watchOS 26; GitHub images ship several Xcodes and the default
      # (Xcode 16.x) has no watchOS 26 SDK. Select the newest installed.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (watchOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project SkyWatch.xcodeproj \
            -scheme SkyWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Test
        run: |
          # The device name contains parens of its own ("Series 10 (46mm)"), so target the
          # simulator by UDID instead of parsing a name.
          UDID=$(xcrun simctl list devices available \
            | grep "Apple Watch" \
            | head -1 \
            | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          echo "Testing on UDID: $UDID"
          xcodebuild test \
            -project SkyWatch.xcodeproj \
            -scheme SkyWatch \
            -destination "platform=watchOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
